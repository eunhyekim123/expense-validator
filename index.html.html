<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>영업활동비 자동 산정 및 검증</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f7fa; color: #333; }
        .container { display: flex; flex-direction: column; min-height: 100vh; }
        .header { background: linear-gradient(135deg, #366092 0%, #244060 100%); color: white; padding: 40px 20px; text-align: center; }
        .header h1 { font-size: 32px; margin-bottom: 10px; }
        .header p { font-size: 14px; opacity: 0.9; }
        .main { flex: 1; padding: 30px 20px; max-width: 1400px; margin: 0 auto; width: 100%; }
        .upload-section { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 30px; }
        .upload-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-bottom: 30px; }
        @media (max-width: 768px) { .upload-grid { grid-template-columns: 1fr; } }
        .upload-area { border: 2px dashed #ccc; border-radius: 8px; padding: 30px; text-align: center; cursor: pointer; background: #fafbfc; transition: all 0.3s; }
        .upload-area:hover { border-color: #366092; background: #f0f4f8; }
        .upload-area.drag { border-color: #366092; background: #e8f0f8; box-shadow: 0 0 0 3px rgba(54,96,146,0.1); }
        .upload-area.ready { border-color: #4caf50; background: #f1f8f4; }
        .upload-icon { font-size: 40px; margin-bottom: 15px; }
        .upload-title { font-size: 16px; font-weight: 600; margin-bottom: 5px; }
        .upload-desc { font-size: 13px; color: #666; margin-bottom: 10px; }
        .upload-hint { font-size: 12px; color: #999; font-style: italic; }
        .file-info { display: flex; align-items: center; gap: 15px; }
        .file-icon { font-size: 32px; }
        .file-name { font-weight: 600; color: #333; }
        .file-size { font-size: 12px; color: #999; }
        .btn-group { display: flex; gap: 10px; justify-content: center; margin-top: 20px; flex-wrap: wrap; }
        .btn { padding: 12px 24px; border: none; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.3s; }
        .btn-primary { background: #366092; color: white; }
        .btn-primary:hover:not(:disabled) { background: #244060; box-shadow: 0 2px 8px rgba(54,96,146,0.3); }
        .btn-primary:disabled { background: #ccc; cursor: not-allowed; }
        .btn-secondary { background: #e0e0e0; color: #333; }
        .btn-secondary:hover { background: #d0d0d0; }
        .message { padding: 15px; margin-top: 20px; border-radius: 4px; display: none; }
        .msg-error { background: #ffebee; border-left: 4px solid #f44336; color: #c62828; display: block; }
        .msg-success { background: #e8f5e9; border-left: 4px solid #4caf50; color: #2e7d32; display: block; }
        .kpi-section { margin-bottom: 30px; }
        .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; }
        .kpi-card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); text-align: center; border-left: 4px solid #366092; }
        .kpi-label { font-size: 12px; color: #666; font-weight: 600; margin-bottom: 10px; }
        .kpi-value { font-size: 28px; font-weight: 700; color: #333; margin-bottom: 5px; }
        .kpi-unit { font-size: 11px; color: #999; }
        .filter-section { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 20px; }
        .filter-group { display: flex; flex-wrap: wrap; gap: 15px; align-items: center; }
        .filter-tabs { display: flex; gap: 5px; flex-wrap: wrap; }
        .tab { padding: 8px 16px; border: 1px solid #ddd; background: white; border-radius: 4px; cursor: pointer; font-size: 13px; transition: all 0.3s; }
        .tab:hover { border-color: #366092; color: #366092; }
        .tab.active { background: #366092; color: white; border-color: #366092; }
        .filter-input { padding: 8px 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 13px; flex: 1; min-width: 150px; }
        .result-section { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 20px; }
        .result-section h2 { font-size: 18px; margin-bottom: 15px; }
        .result-count { font-size: 12px; color: #666; margin-bottom: 15px; }
        .table-wrap { overflow-x: auto; border: 1px solid #e0e0e0; border-radius: 4px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { background: #366092; color: white; padding: 12px; text-align: left; font-weight: 600; }
        td { padding: 12px; border-bottom: 1px solid #f0f0f0; }
        tr:hover { background: #f8f8f8; }
        .id { font-weight: 600; color: #366092; }
        .num { text-align: right; }
        .over { color: #f44336; font-weight: 600; }
        .badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: 600; }
        .badge-ok { background: #e8f5e9; color: #2e7d32; }
        .badge-over { background: #ffebee; color: #c62828; }
        .badge-check { background: #fff3e0; color: #e65100; }
        .badge-no { background: #f3e5f5; color: #6a1b9a; }
        .empty { text-align: center; padding: 40px 20px; color: #999; }
        .footer { background: #f8f8f8; padding: 20px; text-align: center; font-size: 12px; color: #999; border-top: 1px solid #e0e0e0; }
        .hidden { display: none !important; }
        input[type="file"] { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>📊 영업활동비 자동 산정 및 검증</h1>
            <p>근무현황과 신청내역을 분석하여 영업활동비 적정성을 검증합니다</p>
        </header>

        <main class="main">
            <section class="upload-section" id="uploadSection">
                <div class="upload-grid">
                    <div>
                        <div class="upload-area" id="att-area" ondrop="drop(event, 'att')" ondragover="drag(event)" ondragleave="undrag(event)" onclick="document.getElementById('att-file').click()">
                            <div id="att-content">
                                <div class="upload-icon">📁</div>
                                <div class="upload-text">
                                    <p class="upload-title">📁 근무현황 Excel</p>
                                    <p class="upload-desc">근태 정보가 포함된 파일</p>
                                    <p class="upload-hint">클릭 또는 드래그하여 업로드</p>
                                </div>
                            </div>
                        </div>
                        <input type="file" id="att-file" accept=".xlsx,.xls" onchange="selectFile(event, 'att')">
                    </div>
                    <div>
                        <div class="upload-area" id="exp-area" ondrop="drop(event, 'exp')" ondragover="drag(event)" ondragleave="undrag(event)" onclick="document.getElementById('exp-file').click()">
                            <div id="exp-content">
                                <div class="upload-icon">📁</div>
                                <div class="upload-text">
                                    <p class="upload-title">📁 신청내역 Excel</p>
                                    <p class="upload-desc">신청액 정보가 포함된 파일</p>
                                    <p class="upload-hint">클릭 또는 드래그하여 업로드</p>
                                </div>
                            </div>
                        </div>
                        <input type="file" id="exp-file" accept=".xlsx,.xls" onchange="selectFile(event, 'exp')">
                    </div>
                </div>
                <div class="btn-group">
                    <button class="btn btn-primary" id="analyzeBtn" onclick="analyze()" disabled>✓ 분석 시작</button>
                    <button class="btn btn-secondary" id="resetBtn" onclick="reset()" style="display:none">초기화</button>
                </div>
                <div id="message" class="message"></div>
            </section>

            <div id="resultSection" class="hidden">
                <section class="kpi-section" id="kpiSection"></section>
                <section class="filter-section">
                    <div class="filter-group">
                        <div class="filter-tabs" id="filterTabs"></div>
                        <input type="text" class="filter-input" id="searchInput" placeholder="사번 또는 이름 검색" onkeyup="applyFilter()">
                        <select class="filter-input" id="orgFilter" onchange="applyFilter()">
                            <option value="">조직 - 전체</option>
                        </select>
                    </div>
                </section>
                <section class="result-section">
                    <h2>📋 분석 결과</h2>
                    <div class="result-count" id="resultCount"></div>
                    <div class="table-wrap">
                        <table id="resultTable">
                            <thead>
                                <tr>
                                    <th>사번</th>
                                    <th>성명</th>
                                    <th>조직</th>
                                    <th>영업일</th>
                                    <th>기준액</th>
                                    <th>신청액</th>
                                    <th>초과액</th>
                                    <th>판정</th>
                                </tr>
                            </thead>
                            <tbody id="resultBody"></tbody>
                        </table>
                    </div>
                </section>
                <div class="btn-group">
                    <button class="btn btn-primary" onclick="download()">📥 Excel 다운로드</button>
                    <button class="btn btn-secondary" onclick="reset()">새로 분석</button>
                </div>
            </div>
        </main>

        <footer class="footer">
            <p>ⓘ 모든 데이터는 브라우저에서만 처리됩니다 | 기준: 2026년 8월</p>
        </footer>
    </div>

    <script>
        let state = { att: null, exp: null, results: null, filter: 'all', search: '', org: '' };

        const NON_BIZ = new Set(['연차', '병결', '시간연차(1hr)', '시간연차(2hr)', '시간연차(3hr)', '시간연차(4hr)', '시간연차(5hr)', '시간연차(6hr)', '시간연차(7hr)', '재택근무', '해외출장', '육아휴직 리보딩 휴가', '육아휴직 리보딩 휴가(1hr)', '육아휴직 리보딩 휴가(2hr)', '육아휴직 리보딩 휴가(3hr)', '육아휴직 리보딩 휴가(7hr)', '보호휴가(유급 11주 이내)', '보호휴가(유급 12주~15주)', '종합검진', '기타공가']);
        const EDU = new Set(['교육진행', '사내교육참석', '사내교육참석(4hr)', '사외교육참석', '사외교육참석(4hr)', '국내교육출장(사내)', '국내교육출장(사외)', '자기계발교육', '재택교육']);

        function drag(e) { e.preventDefault(); e.currentTarget.classList.add('drag'); }
        function undrag(e) { e.currentTarget.classList.remove('drag'); }
        function drop(e, t) { e.preventDefault(); e.currentTarget.classList.remove('drag'); document.getElementById(t + '-file').files = e.dataTransfer.files; selectFile({ target: document.getElementById(t + '-file') }, t); }

        function selectFile(e, t) {
            const f = e.target.files[0];
            if (!f) return;
            const a = document.getElementById(t + '-area');
            const c = document.getElementById(t + '-content');
            c.innerHTML = `<div class="file-info"><div class="file-icon">✓</div><div><p class="file-name">${f.name}</p><p class="file-size">${(f.size/1024).toFixed(1)}KB</p></div></div>`;
            a.classList.add('ready');
            state[t] = f;
            updateBtn();
        }

        function updateBtn() { document.getElementById('analyzeBtn').disabled = !state.att || !state.exp; }

        async function analyze() {
            try {
                document.getElementById('analyzeBtn').disabled = true;
                const att = await parseXl(state.att);
                const exp = await parseXl(state.exp);
                const res = calc(att);
                validate(res, exp);
                state.results = res;
                showResult();
                msg('분석 완료: ' + res.length + '명', 's');
            } catch(e) { msg('오류: ' + e.message, 'e'); }
        }

        async function parseXl(f) {
            return new Promise((resolve, reject) => {
                const r = new FileReader();
                r.onload = (e) => {
                    try {
                        const d = new Uint8Array(e.target.result);
                        const w = XLSX.read(d, { type: 'array' });
                        const j = XLSX.utils.sheet_to_json(w.Sheets[w.SheetNames[0]], { header: 1 });
                        resolve(j);
                    } catch(x) { reject(x); }
                };
                r.readAsArrayBuffer(f);
            });
        }

        function calc(d) {
            const r = [];
            let h = -1;
            for (let i = 0; i < Math.min(5, d.length); i++) {
                if (d[i].includes('사번') && d[i].includes('근태')) { h = i; break; }
            }
            if (h === -1) h = 1;
            
            const hm = {};
            d[h].forEach((x, i) => hm[x] = i);
            const em = {};

            for (let i = h + 1; i < d.length; i++) {
                const row = d[i];
                const sb = (row[hm['사번']] || '').toString().trim();
                const at = (row[hm['근태']] || '').toString().trim();
                const dy = (row[hm['근태요일']] || '').toString().trim();
                if (!sb || !at || dy === '휴일') continue;
                const jg = (row[hm['경력개발단계']] || '').toString();
                if (['고문', '부사장', '상무', '자문역'].some(x => jg.includes(x))) continue;
                if (!em[sb]) em[sb] = { 사번: sb, 성명: (row[hm['성명']] || '').toString().trim(), 공식조직: (row[hm['공식조직']] || '').toString().trim(), 직급: jg, 근태: [] };
                em[sb].근태.push(at);
            }

            for (const e of Object.values(em)) {
                let yc = 0, bc = 0, ec = 0, hc = 0;
                for (const at of e.근태) {
                    if (at === '연차') yc++;
                    else if (at === '병결') bc++;
                    else if (EDU.has(at)) ec++;
                    else if (at.includes('시간연차')) {
                        const m = at.match(/(\d+)hr/);
                        if (m) hc += parseInt(m[1]);
                    }
                }
                const hd = Math.floor(hc / 8);
                const wd = 20;
                let um = yc + bc + hd;
                if (ec > 5) um += ec;
                const bd = Math.max(0, wd - um);
                const rg = bd >= 15 ? '15+' : bd >= 10 ? '10-14' : bd >= 5 ? '5-9' : '<5';
                let ba = 0;
                if (rg === '15+') ba = 546125;
                else if (rg === '10-14') ba = 391172;
                else if (rg === '5-9') ba = 235253;
                r.push({ 사번: e.사번, 성명: e.성명, 공식조직: e.공식조직, 직급: e.직급, 영업일: bd, 기준: ba, 신청: null, 초과: 0, 판정: '적정' });
            }
            return r;
        }

        function validate(r, d) {
            let hi = 0;
            if (d[0].includes('사번')) hi = 0;
            else if (d.length > 1 && d[1].includes('사번')) hi = 1;
            const hm = {};
            d[hi].forEach((x, i) => { if (x) hm[x.toString()] = i; });
            const em = {};
            for (let i = hi + 1; i < d.length; i++) {
                const sb = (d[i][hm['사번']] || '').toString().trim();
                if (!sb) continue;
                const amt = parseFloat(d[i][hm['총신청액']] || 0) || (parseFloat(d[i][hm['영업지원비']] || 0) + parseFloat(d[i][hm['유류비']] || 0) + parseFloat(d[i][hm['주차비']] || 0) + parseFloat(d[i][hm['감가상각비']] || 0));
                em[sb] = amt;
            }
            for (const x of r) {
                if (em[x.사번]) {
                    x.신청 = em[x.사번];
                    x.초과 = Math.max(0, x.신청 - x.기준);
                    x.판정 = x.초과 > 0 ? '초과신청' : '적정';
                } else {
                    x.판정 = '미매칭';
                }
            }
        }

        function showResult() {
            document.getElementById('uploadSection').style.display = 'none';
            document.getElementById('resultSection').classList.remove('hidden');
            document.getElementById('resetBtn').style.display = 'inline-block';
            document.getElementById('analyzeBtn').style.display = 'none';
            showKpi();
            createFilter();
            applyFilter();
        }

        function showKpi() {
            const t = state.results.length;
            const ok = state.results.filter(x => x.판정 === '적정').length;
            const ov = state.results.filter(x => x.판정 === '초과신청').length;
            const to = state.results.reduce((a, x) => a + (x.초과 || 0), 0);
            const re = state.results.filter(x => x.판정 === '검토필요').length;
            const no = state.results.filter(x => x.판정 === '미매칭').length;
            const html = `<h2>📊 분석 요약</h2><div class="kpi-grid">
                <div class="kpi-card"><div class="kpi-label">전체</div><div class="kpi-value">${t}</div><div class="kpi-unit">명</div></div>
                <div class="kpi-card"><div class="kpi-label">적정</div><div class="kpi-value">${ok}</div><div class="kpi-unit">${(ok/t*100).toFixed(1)}%</div></div>
                <div class="kpi-card"><div class="kpi-label">초과</div><div class="kpi-value">${ov}</div><div class="kpi-unit">${(ov/t*100).toFixed(1)}%</div></div>
                <div class="kpi-card"><div class="kpi-label">총초과</div><div class="kpi-value">${(to/1000000).toFixed(1)}</div><div class="kpi-unit">백만원</div></div>
                <div class="kpi-card"><div class="kpi-label">검토</div><div class="kpi-value">${re}</div><div class="kpi-unit">명</div></div>
                <div class="kpi-card"><div class="kpi-label">미매칭</div><div class="kpi-value">${no}</div><div class="kpi-unit">명</div></div>
            </div>`;
            document.getElementById('kpiSection').innerHTML = html;
        }

        function createFilter() {
            const t = ['all', 'ov', 'ok', 're', 'no'];
            const l = ['전체', '초과신청', '적정', '검토필요', '미매칭'];
            let html = '';
            t.forEach((x, i) => { html += `<button class="tab ${x === 'all' ? 'active' : ''}" onclick="state.filter='${x}'; applyFilter();">${l[i]}</button>`; });
            document.getElementById('filterTabs').innerHTML = html;
            const org = [...new Set(state.results.map(x => x.공식조직))].filter(Boolean).sort();
            let ohtml = '<option value="">조직 - 전체</option>';
            org.forEach(x => { ohtml += `<option value="${x}">${x}</option>`; });
            document.getElementById('orgFilter').innerHTML = ohtml;
        }

        function applyFilter() {
            const s = document.getElementById('searchInput').value;
            const o = document.getElementById('orgFilter').value;
            state.search = s;
            state.org = o;
            let f = state.results;
            if (state.filter === 'ov') f = f.filter(x => x.판정 === '초과신청');
            else if (state.filter === 'ok') f = f.filter(x => x.판정 === '적정');
            else if (state.filter === 're') f = f.filter(x => x.판정 === '검토필요');
            else if (state.filter === 'no') f = f.filter(x => x.판정 === '미매칭');
            if (s) f = f.filter(x => x.사번.includes(s) || x.성명.includes(s));
            if (o) f = f.filter(x => x.공식조직 === o);
            document.getElementById('resultCount').textContent = '총 ' + f.length + '명';
            let html = '';
            f.forEach(x => {
                const bc = x.판정 === '적정' ? 'badge-ok' : x.판정 === '초과신청' ? 'badge-over' : x.판정 === '검토필요' ? 'badge-check' : 'badge-no';
                html += `<tr><td class="id">${x.사번}</td><td>${x.성명}</td><td>${x.공식조직}</td><td class="num">${x.영업일}일</td><td class="num">${x.기준 > 0 ? x.기준.toLocaleString() : '-'}</td><td class="num">${x.신청 ? x.신청.toLocaleString() : '-'}</td><td class="num over">${x.초과 > 0 ? x.초과.toLocaleString() : '-'}</td><td><span class="badge ${bc}">${x.판정}</span></td></tr>`;
            });
            document.getElementById('resultBody').innerHTML = html;
        }

        function download() {
            const wb = XLSX.utils.book_new();
            const ad = [['사번', '성명', '조직', '영업일', '기준액', '신청액', '초과액', '판정'], ...state.results.map(x => [x.사번, x.성명, x.공식조직, x.영업일, x.기준, x.신청 || 0, x.초과, x.판정])];
            XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(ad), '전체');
            XLSX.writeFile(wb, '영업활동비검증.xlsx');
        }

        function msg(t, ty) {
            const m = document.getElementById('message');
            m.className = 'message ' + (ty === 'e' ? 'msg-error' : 'msg-success');
            m.textContent = t;
            setTimeout(() => { m.className = 'message'; }, 3000);
        }

        function reset() {
            state = { att: null, exp: null, results: null, filter: 'all', search: '', org: '' };
            document.getElementById('att-content').innerHTML = '<div class="upload-icon">📁</div><div class="upload-text"><p class="upload-title">📁 근무현황 Excel</p><p class="upload-desc">근태 정보가 포함된 파일</p><p class="upload-hint">클릭 또는 드래그</p></div>';
            document.getElementById('exp-content').innerHTML = '<div class="upload-icon">📁</div><div class="upload-text"><p class="upload-title">📁 신청내역 Excel</p><p class="upload-desc">신청액 정보가 포함된 파일</p><p class="upload-hint">클릭 또는 드래그</p></div>';
            document.getElementById('att-area').classList.remove('ready');
            document.getElementById('exp-area').classList.remove('ready');
            document.getElementById('uploadSection').style.display = 'block';
            document.getElementById('resultSection').classList.add('hidden');
            document.getElementById('analyzeBtn').style.display = 'inline-block';
            document.getElementById('resetBtn').style.display = 'none';
            document.getElementById('message').className = 'message';
            updateBtn();
        }
    </script>
</body>
</html>
